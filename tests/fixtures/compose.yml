name: openscp-integration
services:
  ftp:
    build:
      context: .
      dockerfile: ftp/Dockerfile
    ports:
      - '127.0.0.1:21210:21'
      - '127.0.0.1:30000-30009:30000-30009'
    healthcheck:
      test: ['CMD', 'pidof', 'vsftpd']
      interval: 2s
      timeout: 3s
      retries: 30
  openssh:
    build:
      context: .
      dockerfile: openssh/Dockerfile
    ports:
      - '127.0.0.1:22222:22'
    volumes:
      - ./runtime/id_ed25519.pub:/fixture-key.pub:ro
    healthcheck:
      test: ['CMD-SHELL', 'ssh-keyscan -t ed25519 -T 2 127.0.0.1 >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: fixture-access-only
      MINIO_ROOT_PASSWORD: fixture-secret-only-not-production
    ports:
      - '127.0.0.1:29000:9000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30
  seed-minio:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/seed.sh']
    volumes:
      - ./minio/seed.sh:/seed.sh:ro
      - ./minio/readonly-policy.json:/readonly-policy.json:ro
